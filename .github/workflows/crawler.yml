name: Get Hot News

# Lightweight self-owned scheduler. No 7-day trial check, no secrets, no Pages required.
# UTC 0/4/12 = Beijing 08:00 / 12:00 / 20:00. Three runs per day keeps the repo active
# (avoids GitHub's 60-day scheduled-workflow auto-disable) with far less load than hourly.

on:
  schedule:
    - cron: '0 0,4,12 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'config/**'
      - '.github/workflows/crawler.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: hot-news
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run crawler
        env:
          GITHUB_ACTIONS: 'true'
        run: uv run python -m trendradar

      - name: Archive daily snapshot
        run: |
          DAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          TIME=$(TZ=Asia/Shanghai date +%H%M)
          mkdir -p "reports/$DAY"
          if [ -f index.html ]; then
            cp index.html "reports/$DAY/$TIME.html"
            echo "Archived reports/$DAY/$TIME.html"
          else
            echo "::warning::index.html was not generated"
          fi
          # Fixed-path index so downstream agents need no GitHub API (avoids anonymous rate limits)
          {
            echo "# $DAY 全球 AI 热点快照索引"
            echo
            echo "最新汇总: https://raw.githubusercontent.com/${{ github.repository }}/master/index.html"
            echo
            echo "当天各时段快照（按时间先后）:"
            for f in $(ls -1 "reports/$DAY"/*.html 2>/dev/null | sort); do
              n=$(basename "$f")
              echo "- https://raw.githubusercontent.com/${{ github.repository }}/master/reports/$DAY/$n"
            done
          } > "reports/$DAY/INDEX.md"

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in index.html reports output/txt output/html; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: AI hot news snapshot $(TZ=Asia/Shanghai date +%Y-%m-%d\ %H:%M)"
            git push
          fi
